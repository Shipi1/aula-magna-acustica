<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Informe comparativo del estudio de acondicionamiento acústico del Teatro Aula Magna UTFSM, con metodología, resultados y gráficos.">
  <title>Estudio de acondicionamiento acústico · Aula Magna UTFSM</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f3f4f6;
      --paper: #fff;
      --ink: #14181e;
      --muted: #48505b;
      --line: #dde1e6;
      --shade: #f8f9fa;
      --accent: #8c2232;
      --soft: #f6e7e9;
      font: 17px/1.62 "Source Sans 3", "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--ink); }
    a { color: var(--accent); text-underline-offset: .2em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .wrap { width: min(100% - 2rem, 76rem); margin-inline: auto; }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .bar { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; justify-content: space-between; padding-block: .85rem; }
    .bar a { font-size: .9rem; font-weight: 650; }
    .layout { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 1.4rem; padding-block: 1.5rem 4rem; }
    #contents { position: sticky; top: 1.25rem; align-self: start; padding-top: .7rem; }
    #contents strong { display: block; margin-bottom: .45rem; }
    #contents ul { list-style: none; margin: 0; padding: 0; }
    #contents a { display: block; padding: .26rem 0; color: var(--muted); font-size: .87rem; line-height: 1.4; text-decoration: none; }
    #contents a:hover, #contents a:focus-visible { color: var(--accent); text-decoration: underline; }
    main { grid-column: 2; min-width: 0; background: var(--paper); border: 1px solid var(--line); padding: clamp(1rem, 4vw, 3.4rem); }
    h1, h2, h3, h4 { line-height: 1.2; letter-spacing: -.025em; text-wrap: balance; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.9rem, 4vw, 3.25rem); }
    h2 { margin: 2.35rem 0 .7rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: clamp(1.4rem, 2.4vw, 1.95rem); scroll-margin-top: 1rem; }
    h3 { margin: 1.6rem 0 .6rem; font-size: 1.2rem; }
    p { margin: .7rem 0 1rem; }
    p, li { max-width: 76ch; overflow-wrap: anywhere; }
    li + li { margin-top: .35rem; }
    #report > :first-child { margin-top: 0; }
    img { display: block; width: auto; max-width: 100%; height: auto; border: 1px solid var(--line); }
    figure { margin: 1.5rem 0; }
    figcaption { margin-top: .55rem; color: var(--muted); font-size: .88rem; }
    .table-scroll { overflow-x: auto; margin: 1.15rem 0; border: 1px solid var(--line); }
    table { width: 100%; min-width: 28rem; border-collapse: collapse; font-size: .89rem; font-variant-numeric: tabular-nums; }
    th, td { padding: .55rem .7rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    thead { background: var(--soft); }
    tbody tr:nth-child(even) { background: var(--shade); }
    tbody tr:last-child td { border-bottom: 0; }
    pre { overflow: auto; padding: 1rem; background: var(--shade); }
    #status { color: var(--muted); }
    #local-picker { margin-bottom: 1rem; }
    #local-picker label { display: block; font-weight: 650; }
    #local-file { display: block; max-width: 100%; margin-top: .4rem; font: inherit; font-size: .9rem; }
    @media (max-width: 54rem) {
      .layout { display: block; }
      #contents { position: static; padding: 0 0 .9rem; }
      #contents ul { display: flex; flex-wrap: wrap; gap: .12rem 1rem; }
    }
    @media (max-width: 34rem) {
      .wrap { width: calc(100% - 1.25rem); }
      .layout { padding-top: .9rem; }
    }
    @media print {
      body { background: white; }
      header, #contents, #local-picker { display: none; }
      .layout { display: block; width: 100%; padding: 0; }
      main { border: 0; padding: 0; }
      figure, tr { break-inside: avoid; }
      table { min-width: 0; font-size: .78rem; }
    }
  </style>
  <script src="vendor/markdown-it-15.0.3.min.js" defer></script>
</head>
<body>
  <header>
    <nav class="wrap bar" aria-label="Navegación del proyecto">
      <a href="../index.html">← Acústica Aula Magna UTFSM</a>
      <a id="markdown" href="INFORME-COMPARATIVO-SALA-SIN-TRATAMIENTO-Y-PROPUESTA-MIXTA.md">Archivo Markdown</a>
    </nav>
  </header>
  <div class="wrap layout">
    <nav id="contents" aria-label="Contenido del informe" hidden>
      <strong>En esta página</strong>
      <ul></ul>
    </nav>
    <main>
      <p id="status" role="status">Cargando el informe…</p>
      <div id="local-picker" hidden>
        <label for="local-file">Seleccionar el informe Markdown</label>
        <input type="file" id="local-file" accept=".md,.markdown">
      </div>
      <noscript><p>Activa JavaScript para leer el informe en esta página o abre el archivo Markdown desde el encabezado.</p></noscript>
      <article id="report" aria-busy="true"></article>
    </main>
  </div>
  <script>
    const article = document.querySelector('#report');
    const status = document.querySelector('#status');
    const source = document.querySelector('#markdown').href;

    function addContents() {
      const nav = document.querySelector('#contents');
      const list = nav.querySelector('ul');
      list.replaceChildren();
      const used = new Set();
      for (const heading of article.querySelectorAll('h2, h3, h4')) {
        const slug = heading.textContent.toLowerCase().normalize('NFD')
          .replace(/\p{Mark}/gu, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'seccion';
        let id = slug;
        for (let suffix = 2; used.has(id) || document.getElementById(id); suffix++) id = `${slug}-${suffix}`;
        used.add(id);
        heading.id = id;
        if (heading.tagName !== 'H2') continue;
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = `#${id}`;
        link.textContent = heading.textContent;
        item.append(link);
        list.append(item);
      }
      nav.hidden = !list.childElementCount;
    }

    function formatReport() {
      for (const table of article.querySelectorAll('table')) {
        const container = document.createElement('div');
        container.className = 'table-scroll';
        container.tabIndex = 0;
        container.setAttribute('role', 'region');
        container.setAttribute('aria-label', 'Tabla del informe');
        table.before(container);
        container.append(table);
      }
      for (const image of article.querySelectorAll('img')) {
        image.loading = 'lazy';
        image.decoding = 'async';
        const paragraph = image.parentElement;
        const caption = paragraph.nextElementSibling;
        if (paragraph.tagName !== 'P' || paragraph.childNodes.length !== 1 ||
            caption?.tagName !== 'P' || !/^Figuras?\s+\d/.test(caption.textContent)) continue;
        const figure = document.createElement('figure');
        const figcaption = document.createElement('figcaption');
        figcaption.append(...caption.childNodes);
        paragraph.replaceWith(figure);
        caption.remove();
        figure.append(image, figcaption);
      }
      addContents();
      const title = article.querySelector('h1');
      if (title) document.title = `${title.textContent} · Aula Magna UTFSM`;
    }

    async function showReport(readMarkdown, errorMessage) {
      article.setAttribute('aria-busy', 'true');
      try {
        const markdown = await readMarkdown();
        article.innerHTML = window.markdownit({ html: false }).render(markdown);
        formatReport();
        status.hidden = true;
        if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
      } catch (error) {
        status.textContent = errorMessage;
        status.hidden = false;
        console.error(error);
      } finally {
        article.removeAttribute('aria-busy');
      }
    }

    function loadReport() {
      if (location.protocol === 'file:') {
        article.removeAttribute('aria-busy');
        const file = document.querySelector('#local-file');
        document.querySelector('#local-picker').hidden = false;
        const filename = decodeURIComponent(new URL(source).pathname.split('/').pop());
        status.textContent = `Para leer el informe desde esta carpeta, selecciona el archivo ${filename}.`;
        file.addEventListener('change', () => {
          const selected = file.files[0];
          file.value = '';
          if (selected) showReport(() => selected.text(), 'El archivo no se pudo leer. Vuelve a seleccionarlo.');
        });
        return;
      }

      showReport(async () => {
        const response = await fetch(source, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      }, 'El informe no se pudo cargar. Recarga la página o abre el archivo Markdown desde el encabezado.');
    }

    document.addEventListener('DOMContentLoaded', loadReport, { once: true });
  </script>
</body>
</html>
